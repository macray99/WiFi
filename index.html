<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#778064">
<title>Welcome Home · Wi‑Fi</title>
<style>
:root{
  --sage:#7c8668; --sage2:#aab197; --forest:#46513e;
  --cream:#fbf7ef; --sand:#e7d8c4; --wood:#a56f43;
  --ink:#2f332b; --muted:#74766d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  min-height:100svh; display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.85),transparent 26%),
    radial-gradient(circle at 88% 18%,rgba(165,111,67,.16),transparent 28%),
    linear-gradient(145deg,#e6e9dd 0%,#f4eee4 45%,#dfcdb8 100%);
  overflow-x:hidden;
}
body:before,body:after{
  content:""; position:fixed; width:300px;height:500px; pointer-events:none; opacity:.2;
  background:repeating-radial-gradient(ellipse at center,var(--forest) 0 7px,transparent 8px 26px);
  filter:blur(.2px); transform:rotate(28deg); border-radius:50%;
}
body:before{left:-210px;bottom:-170px}
body:after{right:-220px;top:-190px;transform:rotate(210deg)}
.shell{width:min(720px,100%);position:relative;z-index:1}
.card{
  position:relative;overflow:hidden;border-radius:34px;
  background:rgba(255,253,248,.72);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:0 30px 80px rgba(64,54,43,.22),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
}
.card:before{
  content:"";position:absolute;inset:0 0 auto 0;height:8px;
  background:linear-gradient(90deg,var(--forest),var(--sage2),var(--sand),var(--wood),var(--forest));
}
.hero{text-align:center;padding:58px 34px 25px}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#707768}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(3.6rem,12vw,7rem);line-height:.9;letter-spacing:-.06em;margin:14px 0 5px}
.script{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:clamp(2rem,7vw,3.8rem);color:var(--forest);transform:rotate(-2deg)}
.ornament{display:flex;align-items:center;gap:12px;width:min(320px,80%);margin:27px auto 0;color:var(--wood)}
.ornament:before,.ornament:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#c2ad95)}
.ornament:after{background:linear-gradient(90deg,#c2ad95,transparent)}
.panel{margin:0 24px 24px;padding:25px;border-radius:25px;background:rgba(246,242,233,.72);border:1px solid rgba(124,134,104,.2)}
.icon{
  width:84px;height:84px;border-radius:27px;margin:-5px auto 18px;display:grid;place-items:center;
  color:#fff;background:linear-gradient(145deg,var(--sage),var(--forest));
  box-shadow:0 15px 30px rgba(70,81,62,.25);transform:rotate(-3deg)
}
.icon svg{width:46px;height:46px;transform:rotate(3deg)}
.rows{display:grid;gap:12px}
.row{
  display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;
  padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.68);
  border:1px solid rgba(165,111,67,.13)
}
.label{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.value{font-weight:750;letter-spacing:.01em;word-break:break-word}
.copy{
  appearance:none;border:0;border-radius:11px;padding:9px 12px;cursor:pointer;
  background:#eee6d9;color:var(--forest);font-weight:800;transition:.18s ease
}
.copy:hover{transform:translateY(-1px);background:#e6dac8}
.copy:active{transform:scale(.98)}
.note{text-align:center;color:var(--muted);font-size:.84rem;line-height:1.55;margin:18px 8px 2px}
.pill{
  width:max-content;max-width:100%;margin:19px auto 0;padding:10px 15px;border-radius:999px;
  background:rgba(124,134,104,.11);color:var(--forest);font-size:.78rem;font-weight:750
}
.footer{text-align:center;padding:0 24px 31px;color:#77766f;font-family:Georgia,serif;font-style:italic;font-size:.92rem}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);padding:11px 16px;border-radius:999px;
  background:#30352d;color:white;font-size:.84rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:5
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){
  body{padding:14px}.card{border-radius:26px}.hero{padding:47px 20px 22px}.panel{margin:0 14px 16px;padding:19px 14px}
  .row{grid-template-columns:1fr auto}.label{grid-column:1/-1}.footer{padding-bottom:24px}
}
@media(prefers-reduced-motion:no-preference){
  .card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .icon{animation:float 4s ease-in-out infinite}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes float{50%{transform:translateY(-5px) rotate(-1deg)}}
}
</style>
</head>
<body>
<main class="shell">
  <section class="card">
    <header class="hero">
      <div class="kicker">Welcome to our home</div>
      <h1>Wi‑Fi</h1>
      <div class="script">Stay awhile</div>
      <div class="ornament">✦</div>
    </header>

    <section class="panel">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <path d="M4.5 10.5a11 11 0 0 1 15 0"/>
          <path d="M7.5 14a6.7 6.7 0 0 1 9 0"/>
          <path d="M10.3 17.4a2.7 2.7 0 0 1 3.4 0"/>
          <circle cx="12" cy="20" r=".8" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      <div class="rows">
        <div class="row">
          <span class="label">Network</span>
          <span class="value" id="ssid">Mahal_Kita</span>
          <button class="copy" type="button" onclick="copyValue('ssid','Network copied')">Copy</button>
        </div>
        <div class="row">
          <span class="label">Password</span>
          <span class="value" id="password">JesusLovesMe!</span>
          <button class="copy" type="button" onclick="copyValue('password','Password copied')">Copy</button>
        </div>
      </div>

      <div class="pill">☕ Make yourself at home</div>
      <p class="note">Choose <strong>Mahal_Kita</strong> in your Wi‑Fi settings, then enter the password above.</p>
    </section>

    <footer class="footer">Good company, good coffee, good connection.</footer>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
async function copyValue(id,message){
  const text=document.getElementById(id).textContent.trim();
  try{
    await navigator.clipboard.writeText(text);
    showToast(message);
  }catch(e){
    const area=document.createElement('textarea');
    area.value=text;document.body.appendChild(area);area.select();
    document.execCommand('copy');area.remove();showToast(message);
  }
}
function showToast(message){
  const toast=document.getElementById('toast');
  toast.textContent=message;toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1500);
}
</script>
</body>
</html>
