<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 24px;
      background: #1c1c1e;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .subtitle { margin: 0 0 28px; color: #aaa; }
    .label { margin-top: 18px; color: #999; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
    .value { margin-top: 6px; font-size: 20px; word-break: break-word; }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }
    #status { min-height: 22px; margin-top: 12px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome 👋</h1>
    <p class="subtitle">Wi-Fi access</p>

    <div class="label">Network</div>
    <div class="value">Mahal_Kita</div>

    <div class="label">Password</div>
    <div class="value" id="password">JesusLovesMe!</div>

    <button onclick="copyPassword()">Copy Wi-Fi Password</button>
    <div id="status"></div>
  </main>

  <script>
    function copyPassword() {
      const password = document.getElementById("password").textContent;
      navigator.clipboard.writeText(password).then(() => {
        document.getElementById("status").textContent = "Password copied!";
      }).catch(() => {
        document.getElementById("status").textContent = "Press and hold the password to copy it.";
      });
    }
  </script>
</body>
</html>
