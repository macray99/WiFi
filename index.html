<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8f9876" />
  <title>Welcome Home | Wi‑Fi</title>

  <style>
    :root{
      --sage:#8f9876;
      --sage-dark:#626d50;
      --sage-soft:#dce0d2;
      --beige:#eadfcd;
      --cream:#fbf8f2;
      --wood:#b98555;
      --ink:#2b2b27;
      --muted:#736f66;
      --white:#fffdf9;
      --shadow:0 18px 45px rgba(77,68,56,.16);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(143,152,118,.14), transparent 28%),
        radial-gradient(circle at 90% 5%, rgba(185,133,85,.11), transparent 24%),
        linear-gradient(180deg,#fdfbf7 0%,#f5efe5 100%);
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 18px;
      overflow-x:hidden;
    }

    .leaf{
      position:fixed;
      width:180px;
      height:180px;
      opacity:.11;
      pointer-events:none;
      z-index:0;
    }

    .leaf::before,
    .leaf::after{
      content:"";
      position:absolute;
      width:55px;
      height:95px;
      background:var(--sage-dark);
      border-radius:100% 0 100% 0;
      transform:rotate(-35deg);
    }

    .leaf::before{left:48px;top:16px}
    .leaf::after{left:92px;top:64px;transform:rotate(30deg) scale(.88)}
    .leaf.one{left:-65px;bottom:-45px;transform:rotate(-20deg)}
    .leaf.two{right:-70px;top:-25px;transform:rotate(155deg)}

    .card{
      width:min(760px,100%);
      background:rgba(255,253,249,.94);
      border:1px solid rgba(143,152,118,.22);
      box-shadow:var(--shadow);
      border-radius:28px;
      overflow:hidden;
      position:relative;
      z-index:1;
      backdrop-filter:blur(10px);
    }

    .top-accent{
      height:9px;
      background:linear-gradient(90deg,var(--sage),var(--beige),var(--wood),var(--sage));
    }

    .hero{
      padding:58px 42px 28px;
      text-align:center;
      position:relative;
    }

    .eyebrow{
      letter-spacing:.28em;
      text-transform:uppercase;
      font-size:.75rem;
      color:var(--muted);
      margin-bottom:8px;
    }

    h1{
      margin:0;
      font-size:clamp(3.3rem,11vw,6.5rem);
      line-height:.9;
      font-weight:400;
      letter-spacing:-.04em;
    }

    .script{
      margin-top:7px;
      font-family:"Brush Script MT","Segoe Script",cursive;
      font-size:clamp(2.1rem,7vw,4.2rem);
      color:var(--sage-dark);
      transform:rotate(-2deg);
    }

    .divider{
      margin:28px auto 0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      color:var(--sage-dark);
      max-width:340px;
    }

    .divider::before,
    .divider::after{
      content:"";
      height:1px;
      flex:1;
      background:#cdbda8;
    }

    .wifi-panel{
      margin:6px 32px 32px;
      padding:26px;
      background:
        linear-gradient(135deg,rgba(220,224,210,.78),rgba(250,246,238,.95));
      border:1px solid rgba(143,152,118,.25);
      border-radius:22px;
    }

    .wifi-icon{
      width:76px;
      height:76px;
      border-radius:50%;
      display:grid;
      place-items:center;
      margin:-4px auto 16px;
      background:var(--sage-dark);
      color:white;
      box-shadow:0 10px 25px rgba(98,109,80,.25);
    }

    .wifi-icon svg{width:44px;height:44px}

    .details{
      display:grid;
      gap:12px;
      margin-top:18px;
    }

    .detail{
      display:grid;
      grid-template-columns:110px 1fr auto;
      align-items:center;
      gap:12px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(185,133,85,.16);
      padding:14px 15px;
      border-radius:14px;
    }

    .label{
      font-size:.78rem;
      letter-spacing:.13em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .value{
      font-family:Arial,sans-serif;
      font-weight:700;
      word-break:break-word;
    }

    button{
      border:0;
      background:var(--wood);
      color:white;
      border-radius:10px;
      padding:9px 12px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
    }

    button:hover{transform:translateY(-1px);filter:brightness(.97)}
    button:active{transform:translateY(0)}

    .join{
      display:block;
      width:100%;
      margin-top:18px;
      padding:15px 18px;
      background:var(--sage-dark);
      border-radius:14px;
      text-decoration:none;
      color:white;
      font-family:Arial,sans-serif;
      font-weight:800;
      letter-spacing:.02em;
      text-align:center;
      box-shadow:0 9px 20px rgba(98,109,80,.18);
    }

    .note{
      text-align:center;
      margin:18px 5px 0;
      font-size:.9rem;
      color:var(--muted);
      line-height:1.5;
    }

    .footer{
      padding:0 32px 34px;
      text-align:center;
      color:var(--muted);
      font-size:.82rem;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    @media (max-width:600px){
      body{padding:14px}
      .card{border-radius:22px}
      .hero{padding:45px 22px 22px}
      .wifi-panel{margin:4px 16px 20px;padding:20px 16px}
      .detail{grid-template-columns:1fr auto}
      .label{grid-column:1 / -1}
      .footer{padding:0 18px 26px}
    }
  </style>
</head>

<body>
  <div class="leaf one"></div>
  <div class="leaf two"></div>

  <main class="card">
    <div class="top-accent"></div>

    <section class="hero">
      <div class="eyebrow">Welcome to our home</div>
      <h1>Wi‑Fi</h1>
      <div class="script">Stay awhile</div>

      <div class="divider">♥</div>
    </section>

    <section class="wifi-panel">
      <div class="wifi-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M5 12.5a10.5 10.5 0 0 1 14 0"/>
          <path d="M8.2 15.6a6 6 0 0 1 7.6 0"/>
          <path d="M11 18.5a1.7 1.7 0 0 1 2 0"/>
          <circle cx="12" cy="20" r=".7" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      <div class="details">
        <div class="detail">
          <span class="label">Network</span>
          <span class="value" id="ssid">Mahal_Kita</span>
          <button onclick="copyText('ssid', this)">Copy</button>
        </div>

        <div class="detail">
          <span class="label">Password</span>
          <span class="value" id="password">JesusLovesMe!</span>
          <button onclick="copyText('password', this)">Copy</button>
        </div>
      </div>

      <!-- Replace Mahal_Kita and JesusLovesMe! below too -->
      <a class="join" href="WIFI:T:WPA;S:Mahal_Kita;P:JesusLovesMe!;;">
        Tap to Join Wi‑Fi
      </a>

      <p class="note">
        Tap the button above, or copy the network name and password.
      </p>
    </section>

    <div class="footer">Sage • Beige • Wood</div>
  </main>

  <script>
    async function copyText(id, button){
      const value = document.getElementById(id).innerText;
      try{
        await navigator.clipboard.writeText(value);
        const old = button.innerText;
        button.innerText = "Copied";
        setTimeout(() => button.innerText = old, 1300);
      }catch(e){
        alert("Press and hold the text to copy it.");
      }
    }
  </script>
</body>
</html>
